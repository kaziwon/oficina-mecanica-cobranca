services:
  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    ports:
      - "127.0.0.1::9324"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: LocalCiSonarCobranca123
      MYSQL_ROOT_HOST: '%'
    ports:
      - "127.0.0.1::3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host 127.0.0.1 --user root --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
