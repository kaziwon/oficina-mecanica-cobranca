name: Integracao continua - Cobranca

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar workflows do GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Cobranca.slnx
      - run: dotnet build OficinaMecanica.Cobranca.slnx --configuration Release --no-restore

  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    needs: build
    services:
      elasticmq:
        image: softwaremill/elasticmq:1.7.1
        ports: ["9324:9324"]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: CiCobranca123
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pCiCobranca123 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SQS_TEST_ENDPOINT: http://127.0.0.1:9324
      MYSQL_TEST_CONNECTION_STRING: 'Server=127.0.0.1;Port=3306;User=root;Password=CiCobranca123;AllowPublicKeyRetrieval=true;SslMode=None'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OficinaMecanica.Cobranca.slnx
      - run: >-
          dotnet test OficinaMecanica.Cobranca.slnx --configuration Release --no-restore
          --settings cobertura.runsettings --collect:"XPlat Code Coverage"
          --logger trx --results-directory TestResults
      - name: Exigir cobertura minima de 80%
        run: python3 tools/verificar_cobertura.py --servico Cobranca --diretorio TestResults --json TestResults/cobertura-resumo.json
      - name: Publicar relatorios de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-cobranca
          path: |
            TestResults/**/coverage.cobertura.xml
            TestResults/**/coverage.opencover.xml
            TestResults/cobertura-resumo.json
            TestResults/**/*.trx
          if-no-files-found: warn
